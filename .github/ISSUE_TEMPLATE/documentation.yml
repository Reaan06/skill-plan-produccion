name: Documentation gap
description: Report unclear, missing, or incorrect documentation.
title: "[docs] "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the file or section, or describe where the gap appears.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Suggest concise wording, structure, or an example that would resolve the gap.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets, private project information, and sensitive data, and I understand security vulnerabilities must be reported privately.
          required: true
